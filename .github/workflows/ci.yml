name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Lint only — `ruff format` is deliberately NOT enforced. tether aligns
  # inline comments by hand throughout (see store.py's ranking commentary);
  # the formatter would reflow 22 of 28 files and destroy that alignment for
  # no correctness gain. `ruff check` catches the defects; layout stays human.
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src tests bench scripts

  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  # The matrix above always resolves the newest `mcp`. That is exactly how #69
  # slipped through: mcp 2.0 renamed FastMCP -> MCPServer and broke every fresh
  # install, with no red build until a user hit it. tether supports both majors
  # via an import shim, so pin the OLD major here and prove it still works.
  mcp-compat:
    name: mcp ${{ matrix.mcp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mcp: ["<2", ">=2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + pinned mcp major
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "mcp${{ matrix.mcp }}"

      - name: Show resolved mcp + server binding
        run: |
          pip show mcp | head -2
          python -c "from tether import server; print('bound:', type(server.mcp).__module__)"

      - name: Run tests
        run: pytest -v
